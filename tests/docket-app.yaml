name: tests
version: "9"
description: Test management — plans, sets, tests, and the executions that record what happened

# The model is Xray's, because Xray's is right about one thing: a run is not a
# field on a test. A test says what should happen; an execution says what did,
# on which build, in which environment, and a run is the meeting of the two.
# Kept as separate notes rather than as a status on the test, because a test
# that only carries its last result cannot answer "did this ever pass on
# staging", which is the question a release actually asks.
vocabulary:
  types:
    - name: test_plan
      level: 2
    - name: test_set
      level: 1
    - name: test_execution
      level: 1
      board: false
    - name: test
      board: false
    - name: test_run
      level: -1
      board: false
  fields:
    # The test: what should happen.
    - name: steps
      label: Steps
      kind: text
      types: [test]
      help: Or a gherkin block in the body, which the feature file collects.
    - name: preconditions
      label: Preconditions
      kind: text
      types: [test]
    - name: automated
      label: Automated
      kind: flag
      types: [test]
    - name: automation_id
      label: Automation id
      kind: text
      types: [test, test_run]
      help: >
        What the runner calls this test — "suite.ClassName.method". The results
        importer matches on it, because a title is written for people and
        changes when somebody improves the wording.

    # The execution: what was run, where, on what.
    - name: generated
      label: Derived id
      kind: flag
      types: [test]
      help: >
        The automation never named this test, so its id was derived from the
        feature file and the scenario name. Rename the scenario and it becomes
        a different test — tag the scenario to settle it.

    - name: environment
      label: Environment
      kind: text
      types: [test_execution]
      required: true
      help: staging, production, a device — where these runs happened.
    - name: revision
      label: Revision
      kind: text
      types: [test_execution]
      help: The build or commit. Without it a result is about no particular software.
    - name: started
      label: Started
      kind: datetime
      types: [test_execution]
    - name: finished
      label: Finished
      kind: datetime
      types: [test_execution]

    # The run: what happened to one test in one execution.
    - name: result
      label: Result
      kind: choice
      choices: [todo, executing, passed, failed, aborted]
      types: [test_run]
      required: true
    - name: ran_at
      label: Ran at
      kind: datetime
      types: [test_run]
    - name: evidence
      label: Evidence
      kind: text
      types: [test_run]
      help: A link to the log, the screenshot, the recording.
  relations:
    - name: tests           # a test covers work
      inverse: tested_by
    - name: runs            # a run is of a test
      inverse: run_by
    - name: found           # a run found a defect
      inverse: found_in
    - name: includes        # a set or a plan holds tests
      inverse: included_in

surfaces:
  pages:
    - name: coverage
      title: Test coverage
      run: hooks/coverage.sh
    - name: executions
      title: Executions
      run: hooks/executions.sh
    - name: feature
      title: Feature file
      run: hooks/feature.sh
  inbox:
    - name: junit
      run: hooks/receive-junit.sh
      secret_env: DOCKET_JUNIT_SECRET
  actions:
    - name: run-tests
      title: Run the scenarios
      on: feature
      confirm: Run every scenario now? Whatever the runner writes is committed.
      run: hooks/run-tests.sh
  panels:
    - name: runs-here
      title: Runs in this execution
      run: hooks/runs-here.sh
    - name: covered-by
      title: Tested by
      run: hooks/covered-by.sh
    - name: last-runs
      title: Last runs
      run: hooks/last-runs.sh
