# What this app is, and what a vault takes on by installing it.
name: tests
version: "1"
description: Test management — a test is work, and what it covers is a link

# Everything below lands in docket.yaml. Nothing here is executed.
vocabulary:
  types:
    - name: test_plan
      level: 1
    - name: test
    - name: test_run
  fields:
    - name: steps
      label: Steps
      kind: text
      types: [test]
      help: What to do, one line each. The expected result is the last line.
    - name: preconditions
      label: Preconditions
      kind: text
      types: [test]
    - name: automated
      label: Automated
      kind: flag
      types: [test]
    - name: result
      label: Result
      kind: choice
      choices: [passed, failed, blocked, skipped]
      types: [test_run]
    - name: ran_at
      label: Ran at
      kind: datetime
      types: [test_run]
  relations:
    - name: tests
      inverse: tested_by
    - name: verifies
      inverse: verified_by

# What a test-management product actually sells is not the vocabulary — it is
# the coverage report. These draw it.
surfaces:
  pages:
    - name: coverage
      title: Test coverage
      run: hooks/coverage.sh
    - name: feature
      title: Feature file
      run: hooks/feature.sh
  panels:
    - name: covered-by
      title: Tested by
      run: hooks/covered-by.sh
